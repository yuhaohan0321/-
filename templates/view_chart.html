{% extends "base.html" %}
{% block title %}{{ chart.name }} - 图表查看{% endblock %}
{% block extra_head %}
<script src="{{ url_for('static', filename='js/echarts.min.js') }}"></script>
{% endblock %}
{% block content %}
<div class="mb-3">
    <a href="{{ url_for('chart.list_charts') }}" class="btn btn-outline-secondary btn-sm">← 返回图表库</a>
    <a href="{{ url_for('excel.view_dataset', dataset_id=chart.dataset_id) }}"
       class="btn btn-outline-primary btn-sm ms-2">📋 查看原始数据</a>
</div>

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2>📈 {{ chart.name }}</h2>
        <p class="text-muted mb-0">
            数据集: {{ dataset.name }} |
            类型: <span class="badge bg-info">{{ chart.chart_type }}</span> |
            X: <code>{{ chart.x_column }}</code> |
            Y: <code>{{ chart.y_column }}</code>
        </p>
    </div>
</div>

<div class="card shadow-sm mb-4">
    <div class="card-body">
        <div id="mainChart" style="width:100%;height:500px;"></div>
    </div>
</div>

<script>
const rawData = {
    columns: {{ columns|tojson }},
    rows: {{ data_rows|tojson }}
};
const chartType = '{{ chart.chart_type }}';
const xIdx = {{ x_idx }};
const yIdx = {{ y_idx }};

const chartDom = document.getElementById('mainChart');
const myChart = echarts.init(chartDom);

function renderChart() {
    const xData = rawData.rows.map(r => r[xIdx] !== null ? String(r[xIdx]) : '');
    const yData = rawData.rows.map(r => {
        const v = r[yIdx];
        if (v === null || v === undefined || v === '') return null;
        const n = Number(v);
        return isNaN(n) ? null : n;
    });

    const filtered = [];
    for (let i = 0; i < xData.length; i++) {
        if (yData[i] !== null) {
            filtered.push({ x: xData[i], y: yData[i] });
        }
    }
    const fxData = filtered.map(d => d.x);
    const fyData = filtered.map(d => d.y);

    let option;
    if (chartType === 'pie') {
        option = {
            title: { text: rawData.columns[yIdx] + ' 分布', left: 'center' },
            tooltip: { trigger: 'item' },
            series: [{
                type: 'pie',
                radius: ['30%', '65%'],
                data: fxData.map((name, i) => ({ name, value: fyData[i] })),
                emphasis: { itemStyle: { shadowBlur: 10, shadowOffsetX: 0, shadowColor: 'rgba(0,0,0,0.5)' } }
            }]
        };
    } else {
        option = {
            title: { text: '{{ chart.name }}', left: 'center' },
            tooltip: { trigger: 'axis' },
            xAxis: {
                type: 'category',
                data: fxData,
                axisLabel: { rotate: fxData.length > 10 ? 45 : 0 }
            },
            yAxis: { type: 'value' },
            series: [{
                name: rawData.columns[yIdx],
                type: chartType,
                data: fyData,
                smooth: chartType === 'line',
                itemStyle: { color: '#0d6efd' }
            }]
        };
    }

    myChart.setOption(option, true);
}

renderChart();
window.addEventListener('resize', () => myChart.resize());
</script>
{% endblock %}
